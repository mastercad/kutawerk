name: "Build & Push Docker Images"

on:
  workflow_run:
    workflows: ["Quality Assurance"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zusätzlicher Image-Tag"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/${{ github.repository_owner }}/kutawerk-php
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/kutawerk-web

jobs:
  build-push:
    name: "Build & Push"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: PHP image metadata
        id: meta-php
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PHP_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: php
          push: true
          tags: ${{ steps.meta-php.outputs.tags }}
          labels: ${{ steps.meta-php.outputs.labels }}
          cache-from: type=gha,scope=kutawerk-php
          cache-to: type=gha,mode=max,scope=kutawerk-php

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=kutawerk-web
          cache-to: type=gha,mode=max,scope=kutawerk-web
