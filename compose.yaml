services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kutawerk
      MYSQL_USER: kutawerk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kutawerk_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrations:
    build:
      context: .
      target: php
    environment: &app-environment
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:-change-this-local-secret}
      DATABASE_URL: mysql://kutawerk:${MYSQL_PASSWORD:-kutawerk_local}@database:3306/kutawerk?serverVersion=8.4.0&charset=utf8mb4
      DEFAULT_URI: ${KUTAWERK_DEFAULT_URI:-http://localhost:8098}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-info@kutawerk.de}
    command: sh -c "php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && php bin/console app:content:import-legacy --no-interaction"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  php:
    build:
      context: .
      target: php
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - uploads_data:/app/public/uploads

  web:
    build:
      context: .
      target: web
    ports:
      - "${HTTP_PORT:-8098}:80"
    depends_on:
      - php
    restart: unless-stopped
    volumes:
      - uploads_data:/app/public/uploads:ro

volumes:
  database_data:
  uploads_data:
