security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|media|styles|scripts)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: editor_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: home
    access_control:
        - { path: ^/editor/login$, roles: PUBLIC_ACCESS }
        - { path: ^/invitation/, roles: PUBLIC_ACCESS }
        - { path: ^/password/, roles: ROLE_USER }
        - { path: ^/editor, roles: ROLE_USER }

